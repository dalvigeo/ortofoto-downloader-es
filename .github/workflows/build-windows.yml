name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar também a Release desta versão"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate resources and build executable
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "build\Gerar_Executavel.ps1"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ortofoto_Downloader_ES_windows_x64_v${{ steps.version.outputs.version }}
          path: dist/Ortofoto_Downloader_ES.exe
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Ortofoto Downloader ES v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Ortofoto_Downloader_ES.exe
          body: |
            ## Ortofoto Downloader ES v${{ steps.version.outputs.version }}

            **Download e construção de mosaicos virtuais dos mapeamentos capixabas.**

            O VRT é construído sob demanda a partir da receita espacial dos blocos.
            Consulte o `CHANGELOG.md` e `docs/AJUDA.md`.
